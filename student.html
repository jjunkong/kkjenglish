let deferredPrompt=null;
function fbBtn(){return document.getElementById('install-btn');}
function isStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
}
function isInApp(){
  const u=navigator.userAgent;
  return /KAKAOTALK|NAVER|Instagram|FBAN|FBAV|Line\/|DaumApps|everytimeApp|wv\)/i.test(u);
}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;});
window.addEventListener('appinstalled',()=>{
  deferredPrompt=null;
  const b=fbBtn(); if(b)b.style.display='none';
});
function installApp(){
  if(deferredPrompt){
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(r=>{
      deferredPrompt=null;
      if(r&&r.outcome==='accepted'){const b=fbBtn(); if(b)b.style.display='none';}
    });
    return;
  }
  const u=navigator.userAgent;
  if(isInApp()){
    const url=location.href;
    try{navigator.clipboard.writeText(url);}catch(e){}
    alert('여기서는 설치할 수 없어요.\n\n주소를 복사했습니다.\n크롬이나 삼성 인터넷을 열고\n주소창에 붙여넣은 뒤,\n다시 이 버튼을 눌러주세요.\n\n'+url);
    return;
  }
  if(/iPad|iPhone|iPod/.test(u)){
    alert('홈 화면에 추가하기\n\n1. 화면 아래 공유 버튼(⬆️)을 누르세요\n2. "홈 화면에 추가"를 선택하세요');
    return;
  }
  let guide='메뉴에서 "홈 화면에 추가"를 선택하세요.';
  if(/SamsungBrowser/i.test(u))guide='아래쪽 ≡ 메뉴 → "현재 페이지 추가"\n→ "홈 화면"을 선택하세요.';
  else if(/Whale/i.test(u))guide='아래쪽 ≡ 메뉴 → "홈 화면에 추가"를 선택하세요.';
  else if(/Firefox|FxiOS/i.test(u))guide='우측 상단 ⋮ 메뉴 → "홈 화면에 추가"를 선택하세요.';
  else if(/EdgA|Edg/i.test(u))guide='아래쪽 ⋯ 메뉴 → "휴대폰에 추가"를 선택하세요.';
  else if(/OPR|OPT/i.test(u))guide='메뉴 → "홈 화면에 추가"를 선택하세요.';
  else if(/Android/i.test(u))guide='우측 상단 ⋮ 메뉴 → "앱 설치" 또는\n"홈 화면에 추가"를 선택하세요.';

}

let _wakeLock=null;
async function requestWake(){
  if(!('wakeLock' in navigator))return;
  if(_wakeLock)return;
  try{
    _wakeLock=await navigator.wakeLock.request('screen');
    _wakeLock.addEventListener('release',()=>{_wakeLock=null;});
  }catch(e){_wakeLock=null;}
}
function releaseWake(){
  if(_wakeLock){try{_wakeLock.release();}catch(e){}_wakeLock=null;}
}

// ── 전체화면 진입 시 가로 자동 회전 ───────
function bindFsRotate(){
  if(window.__fsRotateBound)return;
  window.__fsRotateBound=true;
  const onFs=()=>{
    const fs=document.fullscreenElement||document.webkitFullscreenElement;
    if(!screen.orientation)return;
    try{
      if(fs&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{});
      else if(screen.orientation.unlock)screen.orientation.unlock();
    }catch(e){}
  };
  document.addEventListener('fullscreenchange',onFs);
  document.addEventListener('webkitfullscreenchange',onFs);
}

const trackOf=(title,dw)=>{
  const t=String(title||'');
  if(/월평|월간\s*평가/.test(t))return 'exam';
  if(/방학|휴강/.test(t))return 'off';
  if(/GRAMMAR\s*TREE|그래머/i.test(t))return 'gr';
  if(/문장뽀개기|뽀개기/.test(t))return 'rd';
  if(dw===1||dw===2)return 'gr';
  if(dw===4||dw===5)return 'rd';
  return 'etc';
};
// "중급_GRAMMAR TREE_시제 (36:10)" → "시제"
const cleanUnit=t=>{
  let x=String(t||'').replace(/\([^)]*\)/g,'').trim();
  x=x.replace(/^[•·\-\s]+/,'');
  const parts=x.split('_').map(p=>p.trim()).filter(Boolean);
  if(parts.length>=3)return parts.slice(2).join(' ');
  if(parts.length===2)return parts[1];
  return x;
};

function stepOf(stu){
  const cls=(MEM.classes||[]).find(c=>String(c.id)===String(stu.classId));
  const t=((cls&&cls.name)||'')+' '+(stu.level||'');
  if(/스타터|초등/.test(t))return 's1';
  if(/도전/.test(t))return 's2';
  if(/중급/.test(t))return 's3';
  if(/고등|고급/.test(t))return 's4';
  return null;
}

// 영상 제목에서 날짜 [1106] 와 주차(3주차 / 3주 / W3) 를 읽습니다.
function vidDate(t){
  const m=String(t||'').match(/\[(\d{2})(\d{2})\]/);
  if(!m)return '';
  const yy=new Date().getFullYear();
  return `${yy}-${m[1]}-${m[2]}`;
}
function vidWeek(t){
  const s=String(t||'');
  let m=s.match(/(\d{1,2})\s*주\s*차/)||s.match(/(\d{1,2})\s*주(?![가-힣])/)||s.match(/\bW\s*(\d{1,2})\b/i);
  return m?Number(m[1]):0;
}
// 오늘 올라온 영상 / 주차
function todayVideos(stu){
  const ids=stu.videos||[];
  return (MEM.videos||[]).filter(v=>ids.includes(v.id)&&vidDate(v.title)===TODAY);
}
function curWeek(stu){
  const ids=stu.videos||[];
  const mine=(MEM.videos||[]).filter(v=>ids.includes(v.id));
  // 오늘 영상 → 가장 최근 지난 영상 순으로 주차를 찾습니다.
  const dated=mine.map(v=>({d:vidDate(v.title),w:vidWeek(v.title)}))
                  .filter(x=>x.d&&x.w&&x.d<=TODAY).sort((a,b)=>a.d.localeCompare(b.d));
  return dated.length?dated[dated.length-1].w:0;
}

// 학생의 단계 — 원장이 지정한 값이 있으면 그걸 씁니다.
function myStep(stu){
  const c=stu.curri||{};
  if(c.step&&STEPS[c.step])return c.step;
  return stepOf(stu);
}
// 주차별 상태 — 원장이 찍어둔 값이 먼저입니다.
function weekState(stu,n,wk){
  const w=(stu.curri&&stu.curri.w)||{};
  const m=w[String(n)];
  if(wk&&n===wk)return m==='miss'?'miss':'today';
  if(m==='done'||m==='miss')return m;
  if(wk&&n<wk)return 'done';
  return 'future';
}
// 내신 대비 기간인지
function examNow(stu){
  const cls=(MEM.classes||[]).find(c=>String(c.id)===String(stu.classId));
  if(!cls||!cls.examFrom||!cls.examTo)return null;
  if(TODAY<cls.examFrom||TODAY>cls.examTo)return null;
  return {from:cls.examFrom,to:cls.examTo,label:cls.examLabel||'내신 대비 기간'};
}

// 영상 재생 — 비메오는 앱 안에서, 나머지는 새 창
function playVid(bg,v){
  if(v.vimeoId){Q._playVideo=v;renderPlayer(bg,v);}
  else if(v.ytId)window.open(`https://www.youtube.com/watch?v=${v.ytId}`,'_blank');
  else if(v.url)window.open(v.url,'_blank');
}

function renderMap(bg,stu){
  const key=myStep(stu);
  const todays=todayVideos(stu);
  const wk=curWeek(stu);
  const ex=examNow(stu);
  const dd=new Date(TODAY+'T00:00:00');
  const dateTxt=`${dd.getMonth()+1}/${dd.getDate()} (${DOWK[dd.getDay()]})`;

  // ── 내신 기간 배너 ─────────────────────────
  if(ex){
    const b=mks('div','border-radius:18px;padding:15px 16px;margin-bottom:12px;background:linear-gradient(135deg,#FFF1E0,#FFE2C2);border:2px solid #F0A714;');
    const h=mks('div','display:flex;align-items:center;gap:8px;margin-bottom:7px;');
    h.appendChild(mks('div','font-size:19px;','🔥'));
    h.appendChild(mks('div',`font-size:15px;font-weight:800;color:#8A4B00;font-family:${CF};`,esc(ex.label)));
    b.appendChild(h);
    b.appendChild(mks('div',`font-size:12px;font-weight:700;color:#A96A14;font-family:${CF};line-height:1.5;`,
      `${ex.from.slice(5).replace('-','/')} ~ ${ex.to.slice(5).replace('-','/')} · 커리큘럼을 잠시 멈추고 시험 대비 수업을 해요`));
    bg.appendChild(b);
  }

  // ── 오늘의 영상 ───────────────────────────
  const tv=mks('div','background:rgba(255,255,255,0.85);border-radius:18px;padding:15px 16px;margin-bottom:14px;');
  const th=mks('div','display:flex;align-items:center;gap:8px;margin-bottom:11px;');
  th.appendChild(mks('div','font-size:19px;','▶️'));
  th.appendChild(mks('div',`font-size:14.5px;font-weight:800;color:#0B1A38;font-family:${CF};`,'오늘의 영상'));
  th.appendChild(mks('div',`margin-left:auto;font-size:11.5px;font-weight:700;color:#8A97B4;font-family:${CF};`,dateTxt));
  tv.appendChild(th);
  if(todays.length){
    todays.forEach(v=>{
      const row=mks('button','');
      row.style.cssText=`display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:12px 13px;border-radius:14px;background:linear-gradient(135deg,#EAF0FF,#DCE6FF);border:2px solid #2E63E8;cursor:pointer;margin-bottom:7px;font-family:${CF};`;
      row.appendChild(mks('div','font-size:22px;flex:none;','🎬'));
      const c=mks('div','flex:1;min-width:0;');
      const w=vidWeek(v.title);
      if(w&&!ex)c.appendChild(mks('div',`font-size:10.5px;font-weight:800;color:#2E63E8;margin-bottom:2px;font-family:${CF};`,`${w}주차`));
      c.appendChild(mks('div',`font-size:14px;font-weight:800;color:#0B1A38;font-family:${CF};line-height:1.35;`,
        esc(String(v.title||'').replace(/^\[\d{4}\]\s*/,'').replace(/^\d{1,2}\s*주\s*차?\s*/,''))));
      row.appendChild(c);
      row.appendChild(mks('div',`flex:none;font-size:12.5px;font-weight:800;color:#fff;background:linear-gradient(135deg,#5b9ef8,#2060e8);padding:8px 15px;border-radius:20px;font-family:${CF};`,'▶ 시작'));
      row.onclick=()=>playVid(bg,v);
      tv.appendChild(row);
    });
  }else{
    tv.appendChild(mks('div',`text-align:center;padding:16px 10px;font-size:13px;font-weight:700;color:#8A97B4;font-family:${CF};`,
      '오늘 올라온 영상이 없어요'));
  }
  // 지난 강의 다시 보기
  const ids=stu.videos||[];
  const todayIds=todays.map(v=>v.id);
  const past=(MEM.videos||[]).filter(v=>ids.includes(v.id)&&!todayIds.includes(v.id)).reverse();
  if(past.length){
    const det=document.createElement('details');
    det.style.cssText='margin-top:4px;border-top:1px solid rgba(214,222,239,0.9);padding-top:11px;';
    const sm=document.createElement('summary');
    sm.style.cssText=`font-size:12px;font-weight:800;color:#8A97B4;cursor:pointer;font-family:${CF};`;
    sm.textContent=`지난 강의 다시 보기 (${past.length})`;
    det.appendChild(sm);
    past.forEach(v=>{
      const r=mks('button','');
      r.style.cssText=`display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 11px;border-radius:12px;background:rgba(255,255,255,0.55);border:1.5px solid rgba(220,228,245,0.9);cursor:pointer;margin-top:7px;font-family:${CF};`;
      r.appendChild(mks('div','font-size:17px;flex:none;','🎞️'));
      const c=mks('div','flex:1;min-width:0;');
      c.appendChild(mks('div',`font-size:12.5px;font-weight:700;color:#41527A;font-family:${CF};line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;`,esc(v.title||'강의')));
      r.appendChild(c);
      r.appendChild(mks('div','font-size:13px;color:#8A97B4;flex:none;','▶'));
      r.onclick=()=>playVid(bg,v);
      det.appendChild(r);
    });
    tv.appendChild(det);
  }
  bg.appendChild(tv);

  if(!key){
    const e=mks('div','background:rgba(255,255,255,0.75);border-radius:16px;padding:30px 20px;text-align:center;');
    e.appendChild(mks('div','font-size:36px;margin-bottom:9px;','🗺️'));
    e.appendChild(mks('div',`font-size:14px;font-weight:700;color:#41527A;font-family:${CF};`,'진도표를 준비 중이에요'));
    e.appendChild(mks('div',`font-size:12px;color:#8A97B4;margin-top:6px;font-family:${CF};`,'선생님이 반을 정하면 여기에 보여요'));
    bg.appendChild(e);return;
  }

  // ── 노선도 ────────────────────────────────
  const st=STEPS[key];
  let nowWk=wk;
  if(!nowWk){
    const W=(stu.curri&&stu.curri.w)||{};
    let mx=0;Object.keys(W).forEach(k=>{if(W[k])mx=Math.max(mx,Number(k));});
    if(mx)nowWk=Math.min(mx+1,st.weeks);
  }
  const card=mks('div','background:rgba(255,255,255,0.85);border-radius:18px;padding:16px 16px 10px;');

  const hd=mks('div','display:flex;align-items:flex-start;gap:11px;margin-bottom:12px;');
  const badge=mks('div','flex:none;text-align:center;padding:7px 11px;border-radius:13px;background:linear-gradient(135deg,#2E63E8,#1B47B4);');
  badge.appendChild(mks('div',`font-size:9px;font-weight:800;color:rgba(255,255,255,0.75);letter-spacing:.08em;font-family:${CF};`,'STEP'));
  badge.appendChild(mks('div',`font-size:19px;font-weight:800;color:#fff;line-height:1.1;font-family:${CF};`,String(st.no)));
  hd.appendChild(badge);
  const hc=mks('div','flex:1;min-width:0;');
  hc.appendChild(mks('div',`font-size:17px;font-weight:800;color:#0B1A38;font-family:${CF};`,st.name));
  hc.appendChild(mks('div',`font-size:11.5px;color:#8A97B4;font-weight:600;margin-top:2px;font-family:${CF};`,`${st.sub} · ${st.weeks}주`));
  hd.appendChild(hc);
  card.appendChild(hd);

  // 범례
  const lg=mks('div','display:flex;flex-wrap:wrap;gap:12px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid rgba(214,222,239,0.9);');
  [['#2E63E8','들었어요'],['#E23D5A','못 들었어요'],['#F0A714','지금 여기'],['#D6DEEF','앞으로 배울 내용']].forEach(([c,t])=>{
    const i=mks('div','display:flex;align-items:center;gap:5px;');
    i.appendChild(mks('span',`width:10px;height:10px;border-radius:50%;background:${c};flex:none;`));
    i.appendChild(mks('span',`font-size:11px;font-weight:700;color:#8A97B4;font-family:${CF};`,t));
    lg.appendChild(i);
  });
  card.appendChild(lg);

  const COL={done:'#2E63E8',miss:'#E23D5A',today:'#F0A714',future:'#D6DEEF'};
  const line=mks('div','position:relative;padding-left:4px;');
  st.u.forEach((u,i)=>{
    const n=i+1;
    const stt=weekState(stu,n,nowWk);
    const last=(i===st.u.length-1);
    const nextState=last?null:weekState(stu,n+1,nowWk);

    const row=mks('div','position:relative;display:flex;gap:13px;align-items:flex-start;padding-bottom:4px;');

    const rail=mks('div','position:relative;flex:none;width:30px;display:flex;flex-direction:column;align-items:center;');
    const dot=mks('div','width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex:none;position:relative;z-index:2;');
    if(stt==='done')dot.style.cssText+=`background:${COL.done};color:#fff;font-family:${CF};`,dot.textContent='✓';
    else if(stt==='miss')dot.style.cssText+=`background:${COL.miss};color:#fff;font-family:${CF};`,dot.textContent='✕';
    else if(stt==='today')dot.style.cssText+=`background:${COL.today};color:#fff;font-family:${CF};box-shadow:0 0 0 5px ${COL.today}33;`,dot.textContent=String(n);
    else dot.style.cssText+=`background:#fff;border:2.5px solid ${COL.future};color:#A6B2CC;font-family:${CF};`,dot.textContent=String(n);
    rail.appendChild(dot);
    if(!last){
      const seg=mks('div','width:5px;flex:1;min-height:30px;border-radius:3px;margin-top:-2px;');
      const c1=(stt==='future')?COL.future:(stt==='miss'?COL.miss:(stt==='today'?COL.today:COL.done));
      const c2=(nextState==='future')?COL.future:(nextState==='miss'?COL.miss:COL.done);
      seg.style.cssText+=`background:linear-gradient(${c1},${c2});`;
      rail.appendChild(seg);
    }
    row.appendChild(rail);

    const c=mks('div','flex:1;min-width:0;padding-bottom:14px;');
    const bx=mks('div','border-radius:13px;padding:10px 12px;');
    bx.style.cssText+= stt==='today'
      ? `background:#FFF6E4;border:2px solid ${COL.today};`
      : stt==='miss' ? 'background:rgba(253,236,239,0.8);border:1.5px solid rgba(226,61,90,0.35);'
      : stt==='done' ? 'background:rgba(234,240,255,0.7);border:1.5px solid rgba(46,99,232,0.22);'
      : 'background:rgba(255,255,255,0.55);border:1.5px solid rgba(220,228,245,0.9);';
    const top=mks('div','display:flex;align-items:center;gap:7px;');
    top.appendChild(mks('div',`font-size:13.5px;font-weight:800;color:${stt==='future'?'#6B7A99':'#0B1A38'};font-family:${CF};line-height:1.3;flex:1;min-width:0;`,esc(u[0])));
    if(stt==='today')top.appendChild(mks('div',`flex:none;font-size:10px;font-weight:800;color:#fff;background:${COL.today};padding:3px 9px;border-radius:20px;font-family:${CF};`,'지금 여기'));
    else if(stt==='miss')top.appendChild(mks('div',`flex:none;font-size:10px;font-weight:800;color:${COL.miss};font-family:${CF};`,'못 들음'));
    bx.appendChild(top);
    bx.appendChild(mks('div',`font-size:11.5px;color:#8A97B4;font-weight:600;margin-top:3px;font-family:${CF};line-height:1.35;`,esc(u[1])));
    c.appendChild(bx);
    row.appendChild(c);
    line.appendChild(row);
  });
  card.appendChild(line);
  card.appendChild(mks('div',`text-align:center;font-size:11.5px;font-weight:700;color:#8A97B4;padding-bottom:6px;font-family:${CF};`,
    `다 하면 → ${st.next}`));
  bg.appendChild(card);
  bg.appendChild(mks('div',`text-align:center;font-size:10px;color:#A6B2CC;font-weight:600;padding:8px 0 2px;font-family:${CF};`,'v1115b'));
}

// ── 비메오 인앱 플레이어 ─────────────────
function renderPlayer(bg,v){
  bindFsRotate();
  requestWake();
  bg.innerHTML='';
  const wrap=mks('div','background:#000;width:100%;');
  // 뒤로가기
  const backBtn=mks('button','position:absolute;top:10px;left:10px;z-index:10;background:rgba(0,0,0,0.6);border:none;color:#fff;border-radius:20px;padding:6px 14px;cursor:pointer;font-size:13px;','← 뒤로');
  backBtn.onclick=()=>{Q._playVideo=null;render();};
  wrap.style.position='relative';
  wrap.appendChild(backBtn);

  // 비메오 iframe (해시값 h= 파라미터로 처리)
  const iframe=document.createElement('iframe');
  let vimeoSrc;
  if(v.vimeoId.includes('/')){
    const [vid,hash]=v.vimeoId.split('/');
    vimeoSrc=`https://player.vimeo.com/video/${vid}?h=${hash}&autoplay=1&color=2E63E8&title=0&byline=0&portrait=0`;
  } else {
    vimeoSrc=`https://player.vimeo.com/video/${v.vimeoId}?autoplay=1&color=2E63E8&title=0&byline=0&portrait=0`;
  }
  iframe.src=vimeoSrc;
  iframe.style.cssText='width:100%;aspect-ratio:16/9;border:none;display:block;';
  iframe.allow='autoplay; fullscreen; picture-in-picture';
  iframe.allowFullscreen=true;
  wrap.appendChild(iframe);
  bg.appendChild(wrap);

  // 재생이 안 될 때 안내
  const hint=mks('div','padding:10px 14px;background:rgba(255,255,255,0.9);text-align:center;');
  const hb=mks('button','','화면이 검게 나오면 여기를 눌러 주세요');
  hb.style.cssText=`background:none;border:none;color:#2060e8;font-size:12px;font-weight:700;cursor:pointer;text-decoration:underline;font-family:${CF};`;
  hb.onclick=()=>{window.open(`https://vimeo.com/${v.vimeoId}`,'_blank');};
  hint.appendChild(hb);
  bg.appendChild(hint);

  // 영상 제목
  const titleBox=mks('div','padding:16px 14px;background:rgba(255,255,255,0.95);');
  const t=mks('div','font-size:16px;font-weight:700;color:#0B1A38;',v.title||'강의');t.style.fontFamily=CF;
  if(v.desc){const d=mks('div','font-size:12px;color:rgba(10,26,92,0.5);margin-top:4px;',v.desc);d.style.fontFamily=CF;titleBox.appendChild(t);titleBox.appendChild(d);}
  else titleBox.appendChild(t);
  bg.appendChild(titleBox);
}

// 시작
(async()=>{
  try{const stu=await fbGet('students');if(stu)MEM.stu=Object.values(stu);}catch(e){}
  try{const cls=await fbGet('classes');if(cls)MEM.classes=Array.isArray(cls)?cls:Object.values(cls);}catch(e){}
  try{const vids=await fbGet('videos');if(vids)MEM.videos=Array.isArray(vids)?vids:Object.values(vids);}catch(e){}
  try{const cp=await fbGet('classProgress');if(cp)MEM.cprog=cp;}catch(e){}
  const sid=sesLoad();
  if(sid){const st=MEM.stu.find(x=>x.id===sid);if(st){Q.stu=st;Q.scr='main';}else sesClear();}
  render();
})();

})();
