<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BODA 원장 대시보드</title>
<link rel="manifest" href="/manifest-admin.json?v=2">
<meta name="theme-color" content="#6d28d9">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --ink:#0B1A38; --ink-2:#41527A; --ink-3:#8A97B4;
  --line:#E3E8F4; --line-2:#F0F3FA;
  --bg:#F5F7FC; --card:#FFFFFF;
  --brand:#2E63E8; --brand-d:#1745B8; --brand-w:#EEF3FF;
  --ok:#0EA96B; --ok-w:#E6F7F0;
  --mk:#E08A00; --mk-w:#FFF6E4;
  --no:#E23D5A; --no-w:#FDECEF;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:'Pretendard','Nanum Gothic',-apple-system,sans-serif;
  background:var(--bg); color:var(--ink);
  font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;}

/* ---------- 로그인 ---------- */
#gate{
  position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,#a8c8f8 0%,#90b0f0 50%,#b0a8f0 100%);
}
.gate-card{background:var(--card);border-radius:20px;padding:36px 32px;width:340px;box-shadow:0 20px 50px rgba(11,26,56,.22);}
.gate-card h1{font-size:26px;letter-spacing:-.03em;margin-bottom:4px;}
.gate-card h1 i{color:var(--brand);font-style:normal;}
.gate-card p{color:var(--ink-3);font-size:13px;margin-bottom:22px;}
.gate-card input{width:100%;height:46px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;margin-bottom:12px;}
.gate-card input:focus{border-color:var(--brand);outline:none;}
.gate-card button{width:100%;height:46px;border-radius:12px;background:var(--brand);color:#fff;font-weight:700;}
.gate-err{color:var(--no);font-size:12px;min-height:16px;margin-bottom:8px;}

/* ---------- 레이아웃 ---------- */
#shell{display:none;height:100vh;flex-direction:column;}
#shell.on{display:flex;}
.topbar{
  height:56px;flex:none;display:flex;align-items:center;gap:16px;
  padding:0 20px;background:var(--card);border-bottom:1px solid var(--line);
}
.logo{font-size:19px;font-weight:800;letter-spacing:-.04em;}
.logo i{color:var(--brand);font-style:normal;}
.logo span{font-size:11px;font-weight:600;color:var(--ink-3);margin-left:7px;letter-spacing:0;}
.topbar input[type=date]{height:34px;border:1.5px solid var(--line);border-radius:9px;padding:0 10px;font-weight:600;}
.dow{font-size:12px;font-weight:700;color:var(--brand);background:var(--brand-w);padding:5px 11px;border-radius:7px;}
.spacer{flex:1;}
.ghost{height:34px;padding:0 14px;border-radius:9px;border:1.5px solid var(--line);font-size:13px;font-weight:600;color:var(--ink-2);}
.ghost:hover{border-color:var(--brand);color:var(--brand);}

.cols{flex:1;display:grid;grid-template-columns:250px minmax(0,1fr) 350px;min-height:0;}
.col{min-height:0;overflow-y:auto;}
.col-l{border-right:1px solid var(--line);background:var(--card);}
.col-c{padding:20px 24px;}
.col-r{border-left:1px solid var(--line);background:var(--card);padding:18px;}

@media (max-width:1180px){
  .cols{grid-template-columns:210px minmax(0,1fr);}
  .col-r{display:none;}
}
@media (max-width:820px){
  .cols{display:block;overflow-y:auto;}
  .col{overflow:visible;}
  .col-l{border-right:none;border-bottom:1px solid var(--line);}
}

/* ---------- 좌: 학생 목록 ---------- */
.l-head{padding:14px 16px 10px;position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line-2);}
.l-head .cnt{font-size:11px;color:var(--ink-3);font-weight:600;}
.seg{display:flex;gap:4px;margin-top:9px;background:var(--line-2);padding:3px;border-radius:9px;}
.seg button{flex:1;height:28px;border-radius:7px;font-size:12px;font-weight:700;color:var(--ink-3);}
.seg button.on{background:var(--card);color:var(--brand);box-shadow:0 1px 3px rgba(11,26,56,.1);}
.cls-h{width:100%;display:flex;align-items:center;gap:8px;padding:11px 14px;margin:10px 8px 4px;width:calc(100% - 16px);
  background:var(--line-2);border-radius:10px;text-align:left;transition:background .15s;}
.cls-h:hover{background:var(--brand-w);}
.cls-h.on{background:var(--ink);}
.cls-h .cn{flex:1;font-size:14px;font-weight:800;letter-spacing:-.02em;color:var(--ink);}
.cls-h.on .cn{color:#fff;}
.cls-h .cc{font-size:11px;font-weight:700;color:var(--ink-3);background:var(--card);padding:2px 7px;border-radius:20px;}
.cls-h.on .cc{background:rgba(255,255,255,.2);color:#fff;}
.stu-row b{font-weight:700;font-size:14px;}
.dot{width:9px;height:9px;}
.stu-row{width:100%;text-align:left;padding:9px 16px;display:flex;align-items:center;gap:9px;border-left:3px solid transparent;}
.stu-row:hover{background:var(--line-2);}
.stu-row.on{background:var(--brand-w);border-left-color:var(--brand);}
.stu-row b{font-weight:700;font-size:13.5px;}
.stu-row em{font-style:normal;font-size:11px;color:var(--ink-3);}
.dot{width:7px;height:7px;border-radius:50%;flex:none;}
.d-ok{background:var(--ok);} .d-no{background:var(--no);} .d-mk{background:var(--mk);} .d-na{background:var(--line);}

/* ---------- 중앙 ---------- */
.cal-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.cal-t{flex:1;min-width:0;}
.cal-t b{display:block;font-size:21px;font-weight:800;letter-spacing:-.03em;}
.cal-t span{font-size:12.5px;font-weight:600;color:var(--ink-3);}
.cal-nav{display:flex;gap:5px;align-items:center;}
.cal-nav button{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--line);font-size:17px;font-weight:700;color:var(--ink-2);}
.cal-nav button.today{width:auto;padding:0 12px;font-size:12.5px;}
.cal-nav button:hover{border-color:var(--brand);color:var(--brand);}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;}
.cal-dow{text-align:center;font-size:11px;font-weight:800;color:var(--ink-3);padding:5px 0 7px;}
.cal-dow.sun{color:var(--no);} .cal-dow.sat{color:var(--brand);}
.cal-c{min-height:88px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:6px;overflow:hidden;}
.cal-c.off{background:transparent;border:none;}
.cal-c.now{border-color:var(--brand);border-width:2px;background:var(--brand-w);}
.cal-n{font-size:11.5px;font-weight:800;color:var(--ink-3);margin-bottom:4px;}
.cal-c.sun .cal-n{color:var(--no);} .cal-c.sat .cal-n{color:var(--brand);}
.cal-i{font-size:10.5px;font-weight:700;line-height:1.35;color:var(--ink);background:var(--brand-w);
  border-left:2.5px solid var(--brand);border-radius:0 5px 5px 0;padding:3px 4px;margin-bottom:3px;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;}
.cal-p{font-size:10px;font-weight:700;color:var(--ink-3);}
.cal-f{margin-top:14px;font-size:12.5px;font-weight:600;color:var(--ink-3);text-align:center;}
@media (max-width:900px){.cal-c{min-height:64px;} .cal-i{-webkit-line-clamp:2;}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;}
.card-t{font-size:12px;font-weight:800;color:var(--ink-3);letter-spacing:.04em;margin-bottom:13px;display:flex;align-items:center;gap:8px;}
.card-t .spacer{flex:1;}
.who{display:flex;align-items:baseline;gap:11px;margin-bottom:3px;}
.who h2{font-size:24px;font-weight:800;letter-spacing:-.03em;}
.who span{font-size:12.5px;color:var(--ink-3);font-weight:600;}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:11px;margin-top:15px;}
.meta div{background:var(--line-2);border-radius:9px;padding:9px 11px;}
.meta dt{font-size:10.5px;color:var(--ink-3);font-weight:700;margin-bottom:2px;}
.meta dd{font-size:13.5px;font-weight:700;}

.att-set{display:flex;gap:7px;}
.att-set button{flex:1;height:38px;border-radius:10px;border:1.5px solid var(--line);font-size:13px;font-weight:700;color:var(--ink-3);}
.att-set button.on-ok{background:var(--ok-w);border-color:var(--ok);color:var(--ok);}
.att-set button.on-no{background:var(--no-w);border-color:var(--no);color:var(--no);}
.att-set button.on-mk{background:var(--mk-w);border-color:var(--mk);color:var(--mk);}

.sub-t{font-size:11px;font-weight:800;color:var(--ink-3);margin:14px 0 7px;letter-spacing:.03em;}
.warn{margin-top:9px;background:var(--no-w);color:var(--no);font-size:11.5px;font-weight:700;padding:8px 11px;border-radius:8px;}
.pick{width:100%;height:38px;border:1.5px solid var(--line);border-radius:10px;padding:0 10px;font-weight:600;background:var(--card);}
.pick:focus{border-color:var(--brand);outline:none;}
.pen{display:flex;align-items:center;gap:8px;margin-top:11px;background:var(--line-2);padding:10px 12px;border-radius:9px;cursor:pointer;}
.pen input{width:17px;height:17px;accent-color:var(--no);cursor:pointer;}
.pen span{font-size:12.5px;font-weight:700;color:var(--ink-2);}
.cyc{font-size:11px;font-weight:700;color:var(--ink-3);margin-bottom:9px;}
.left-big{background:var(--brand-w);border-radius:12px;padding:14px;text-align:center;margin-bottom:11px;}
.left-big b{font-size:34px;font-weight:800;color:var(--brand);letter-spacing:-.04em;}
.left-big span{font-size:12px;font-weight:700;color:var(--brand);margin-left:4px;}
.left-big.zero{background:var(--line-2);}
.left-big.zero b,.left-big.zero span{color:var(--ink-3);}
.score-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:9px;}
.score-grid label{display:block;}
.score-grid dt{font-size:10.5px;font-weight:700;color:var(--ink-3);margin-bottom:4px;}
.score-grid input{width:100%;height:38px;border:1.5px solid var(--line);border-radius:9px;text-align:center;font-weight:700;font-size:15px;}
.score-grid input:focus{border-color:var(--brand);outline:none;}

.prog-row{display:grid;grid-template-columns:74px 1fr 1fr auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line-2);}
.prog-row:last-child{border-bottom:none;}
.prog-row .dt{font-size:12px;font-weight:700;color:var(--ink-3);}
.prog-row input{height:34px;border:1.5px solid var(--line);border-radius:8px;padding:0 10px;font-size:13px;width:100%;}
.prog-row input:focus{border-color:var(--brand);outline:none;}
.mini{height:30px;padding:0 11px;border-radius:8px;background:var(--brand);color:#fff;font-size:12px;font-weight:700;}
.mini.q{background:var(--line-2);color:var(--ink-2);}
.empty{color:var(--ink-3);font-size:13px;text-align:center;padding:26px 10px;}

/* ---------- 우: 통계 ---------- */
.r-t{font-size:12px;font-weight:800;color:var(--ink-3);letter-spacing:.04em;margin:0 0 11px;}
.r-sec{margin-bottom:24px;}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:11px;}
.chips button{height:25px;padding:0 9px;border-radius:13px;font-size:11px;font-weight:700;background:var(--line-2);color:var(--ink-3);}
.chips button.on{background:var(--ink);color:#fff;}
.att-stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;}
.att-stat div{border-radius:11px;padding:11px 4px;}
.att-stat b{display:block;font-size:23px;font-weight:800;letter-spacing:-.03em;}
.att-stat span{font-size:11px;font-weight:700;}
.s-ok{background:var(--ok-w);color:var(--ok);}
.s-no{background:var(--no-w);color:var(--no);}
.s-mk{background:var(--mk-w);color:var(--mk);}
.bank{margin-top:9px;background:var(--line-2);border-radius:10px;padding:11px 13px;display:flex;align-items:center;justify-content:space-between;}
.bank span{font-size:12px;font-weight:700;color:var(--ink-2);}
.bank b{font-size:19px;font-weight:800;}
table.avg{width:100%;border-collapse:collapse;font-size:12px;}
table.avg th{text-align:right;font-weight:800;color:var(--ink-3);font-size:10.5px;padding:0 5px 7px;}
table.avg th:first-child{text-align:left;}
table.avg td{text-align:right;padding:7px 5px;border-top:1px solid var(--line-2);font-weight:700;font-variant-numeric:tabular-nums;}
table.avg td:first-child{text-align:left;color:var(--ink-3);font-weight:700;}
.cmt{background:var(--line-2);border-radius:11px;padding:12px 13px;margin-bottom:8px;}
.cmt time{font-size:10.5px;font-weight:800;color:var(--brand);display:block;margin-bottom:4px;}
.cmt p{font-size:12.5px;line-height:1.6;color:var(--ink-2);}
.xtpl2{width:100%;height:40px;border-radius:10px;border:1.5px solid var(--line);font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:12px;}
.xtpl2:hover{border-color:var(--brand);color:var(--brand);}
#smodal{display:none;position:fixed;inset:0;z-index:200;background:rgba(11,26,56,.45);align-items:center;justify-content:center;padding:20px;}
#smodal.on{display:flex;}
.tabs{display:flex;gap:5px;background:var(--line-2);padding:4px;border-radius:11px;margin-bottom:16px;}
.tabs button{flex:1;height:34px;border-radius:8px;font-size:13px;font-weight:700;color:var(--ink-3);}
.tabs button.on{background:var(--card);color:var(--brand);box-shadow:0 1px 3px rgba(11,26,56,.1);}
.vrow{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;cursor:pointer;}
.vrow:hover{background:var(--line-2);}
.vrow input{width:17px;height:17px;accent-color:var(--brand);cursor:pointer;flex:none;}
.vrow input:indeterminate{opacity:.6;}
.vrow div{flex:1;min-width:0;}
.vrow b{display:block;font-size:13px;font-weight:700;}
.vrow em{font-style:normal;font-size:11px;color:var(--ink-3);}
.vrow .cnt{font-size:11px;font-weight:700;color:var(--ink-3);background:var(--line-2);padding:2px 8px;border-radius:20px;}
.vbar{display:flex;gap:7px;margin-bottom:12px;}
.vbar button{height:32px;padding:0 12px;border-radius:8px;border:1.5px solid var(--line);font-size:12px;font-weight:700;color:var(--ink-2);}
.vbar button:hover{border-color:var(--brand);color:var(--brand);}
.vsave{position:sticky;bottom:0;background:var(--card);padding-top:12px;margin-top:8px;border-top:1px solid var(--line);}
.vsave button{width:100%;height:42px;border-radius:10px;background:var(--brand);color:#fff;font-size:14px;font-weight:700;}
.vsave button:disabled{background:var(--line);color:var(--ink-3);}
#xmodal{display:none;position:fixed;inset:0;z-index:200;background:rgba(11,26,56,.45);align-items:center;justify-content:center;padding:20px;}
#xmodal.on{display:flex;}
.xbox{background:var(--card);border-radius:18px;padding:24px;width:560px;max-width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 24px 60px rgba(11,26,56,.3);}
.xbox h3{font-size:19px;font-weight:800;letter-spacing:-.03em;margin-bottom:6px;}
.xdesc{font-size:12.5px;color:var(--ink-2);line-height:1.7;margin-bottom:14px;}
.xdesc b{color:var(--brand);}
.xdrop{display:flex;align-items:center;justify-content:center;height:96px;border:2px dashed var(--line);border-radius:12px;cursor:pointer;font-size:13px;font-weight:700;color:var(--ink-3);text-align:center;padding:10px;}
.xdrop:hover,.xdrop.over{border-color:var(--brand);background:var(--brand-w);color:var(--brand);}
.xsum{display:flex;gap:8px;margin:14px 0 10px;}
.xsum div{flex:1;border-radius:10px;padding:10px;text-align:center;}
.xsum b{display:block;font-size:20px;font-weight:800;}
.xsum span{font-size:11px;font-weight:700;}
.x-ok{background:var(--ok-w);color:var(--ok);}
.x-no{background:var(--no-w);color:var(--no);}
table.xtb{width:100%;border-collapse:collapse;font-size:11.5px;}
table.xtb th{text-align:left;font-size:10.5px;font-weight:800;color:var(--ink-3);padding:0 6px 6px;}
table.xtb td{padding:6px;border-top:1px solid var(--line-2);font-weight:600;}
table.xtb tr.bad td{color:var(--no);background:var(--no-w);}
.xscroll{max-height:220px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:10px;}
.xfoot{display:flex;gap:8px;margin-top:16px;}
.xfoot .ghost{flex:1;height:42px;}
.xgo{flex:2;height:42px;border-radius:10px;background:var(--brand);color:#fff;font-size:14px;font-weight:700;}
.xgo:disabled{background:var(--line);color:var(--ink-3);cursor:not-allowed;}
.xdesc2{font-size:12px;color:var(--ink-3);font-weight:600;margin-bottom:10px;}
.maprow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line-2);}
.maprow:last-child{border-bottom:none;}
.mapl{flex:1;min-width:0;}
.mapl b{font-size:13px;font-weight:700;}
.mapl em{font-style:normal;font-size:11px;color:var(--ink-3);font-weight:600;}
.maprow .pick{width:150px;flex:none;height:34px;}
.xex{margin-top:14px;}
.xline{font-size:11.5px;color:var(--ink-2);padding:4px 0;border-bottom:1px solid var(--line-2);}
.xline span{font-weight:800;color:var(--brand);margin-right:6px;}
.pnow{background:var(--line-2);border-radius:10px;padding:11px 13px;margin-bottom:13px;}
.pnow.ov{background:var(--brand-w);}
.pnow .tag{display:inline-block;font-size:10px;font-weight:800;color:var(--ink-3);background:var(--card);padding:2px 7px;border-radius:5px;margin-right:8px;}
.pnow.ov .tag{color:var(--brand);}
.pnow b{font-size:14px;font-weight:700;}
.pnow em{font-style:normal;font-size:12.5px;color:var(--ink-3);font-weight:600;}
.prog-row.ov{background:var(--brand-w);border-radius:8px;padding-left:8px;padding-right:8px;}
.pbase{grid-column:span 2;font-size:13px;font-weight:600;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pbase em{font-style:normal;color:var(--ink-3);}
.load{text-align:center;color:var(--ink-3);padding:34px 10px;font-size:13px;}
</style>
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <h1>boda<i>.</i></h1>
    <p>원장 대시보드</p>
    <div class="gate-err" id="gerr"></div>
    <input type="password" id="gpw" placeholder="비밀번호" autocomplete="current-password">
    <button id="gbtn">들어가기</button>
  </div>
</div>

<div id="shell">
  <div class="topbar">
    <div class="logo">boda<i>.</i><span>DIRECTOR</span></div>
    <input type="date" id="dsel">
    <span class="dow" id="ddow"></span>
    <div class="spacer"></div>
    <button class="ghost" id="reload">새로고침</button>
    <button class="ghost" id="stubtn">학생 정보 업로드</button>
    <button class="ghost" id="xlsbtn">진도 업로드</button>
    <button class="ghost" id="toadmin">원장방</button>
  </div>
  <div class="cols">
    <div class="col col-l" id="colL"></div>
    <div class="col col-c" id="colC"></div>
    <div class="col col-r" id="colR"></div>
  </div>
</div>

<div id="smodal">
  <div class="xbox">
    <h3>학생 정보 일괄 업로드</h3>
    <p class="xdesc">열 이름은 <b>이름 · 학부모코드 · 영상코드 · 반 · 레벨 · 학교 · 성별 · 교재 · 연락처 · 결제일 · 수업요일</b>. 이름이 이미 있으면 덮어쓰고, 없으면 새로 만듭니다. 빈 칸은 기존 값을 그대로 둡니다.</p>
    <button class="xtpl2" id="stpl">양식 파일 내려받기</button>

<script>
(()=>{
const FB='https://kkjenglish-a831d-default-rtdb.firebaseio.com';
const fbGet=async p=>{try{const r=await fetch(`${FB}/${p}.json`);return r.ok?await r.json():null;}catch{return null;}};
const fbSet=async(p,v)=>{try{const r=await fetch(`${FB}/${p}.json`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(v)});return r.ok;}catch{return false;}};

const DAYS=['일','월','화','수','목','금','토'];
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const n=new Date();return`${n.getFullYear()}-${pad(n.getMonth()+1)}-${pad(n.getDate())}`;};
const dow=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).getDay();};
const und=s=>s.replace(/-/g,'_');
const dsh=s=>s.replace(/_/g,'-');
const md=s=>{const[,m,d]=s.split('-');return`${+m}/${+d}`;};

// 테스트 정의 (dTest는 완료/미완료라 점수 집계에서 제외)
const TESTS=[
  {k:'bTest',    n:'복습테스트', s:'복테', c:'#2E63E8'},
  {k:'oTest',    n:'확인테스트', s:'확테', c:'#0EA96B'},
  {k:'wordTest', n:'단어',      s:'단어', c:'#E08A00'},
  {k:'writeTest',n:'영작',      s:'영작', c:'#8B5CF6'},
  {k:'readTest', n:'독해',      s:'독해', c:'#EC4899'},
  {k:'habangTest',n:'하빵',     s:'하빵', c:'#0891B2'},
];

// 출석: 예전 boolean(true/false) 데이터와 호환
// true → 출석 / 'present','absent','makeup' → 신규 3단계
const attOf=l=>{
  const a=l&&l.attend;
  if(a===true||a==='present')return 'present';
  if(a==='absent')return 'absent';
  if(a==='makeup')return 'makeup';
  return '';
};

// ── 결석 사유 ─────────────────────────────
const REASONS=[
  {k:'sick',    n:'질병·경조사', cap:2, c:'#0891B2'},
  {k:'personal',n:'개인 사정',   cap:1, c:'#E08A00'},
  {k:'noshow',  n:'무단결석',    cap:0, c:'#E23D5A'},
];
const CYCLE_CAP=2; // 사유 무관 월 최대

// billDay 기준 결제주기의 시작일 (월말 보정)
const lastDay=(y,m)=>new Date(y,m,0).getDate(); // m: 1-based
const cycleStart=(dateStr,billDay)=>{
  if(!billDay)return dateStr.slice(0,8)+'01'; // 결제일 미설정 → 달력 월
  const [y,m,d]=dateStr.split('-').map(Number);
  let cy=y,cm=m;
  if(d<Math.min(billDay,lastDay(y,m))){cm--;if(cm<1){cm=12;cy--;}}
  return `${cy}-${pad(cm)}-${pad(Math.min(billDay,lastDay(cy,cm)))}`;
};
const cycleEnd=(startStr,billDay)=>{
  if(!billDay){const [y,m]=startStr.split('-').map(Number);return `${y}-${pad(m)}-${pad(lastDay(y,m))}`;}
  const [y,m,d]=startStr.split('-').map(Number);
  let ny=y,nm=m+1;if(nm>12){nm=1;ny++;}
  const nd=Math.min(billDay,lastDay(ny,nm));
  const e=new Date(ny,nm-1,nd);e.setDate(e.getDate()-1);
  return `${e.getFullYear()}-${pad(e.getMonth()+1)}-${pad(e.getDate())}`;
};

// 한 결제주기의 보강 정산
function makeupStat(rows,billDay,refDate){
  const st=cycleStart(refDate,billDay), en=cycleEnd(st,billDay);
  const inCycle=d=>d>=st&&d<=en;
  const cnt={sick:0,personal:0,noshow:0};
  let used=0,penalty=0;
  rows.forEach(r=>{
    const a=attOf(r.l);
    if(a==='absent'&&inCycle(r.date)){
      const rs=r.l.reason||'personal';
      if(cnt[rs]!==undefined)cnt[rs]++;
    }
    // 보강은 '원래 결석일'이 속한 주기로 차감 (이월 불가)
    if(a==='makeup'){
      const base=r.l.makeupFor||r.date;
      if(inCycle(base))used++;
    }
    if(r.l&&r.l.penalty&&inCycle(r.date))penalty++;
  });
  const raw=Math.min(cnt.sick,2)+Math.min(cnt.personal,1);
  const entitled=Math.min(raw,CYCLE_CAP);
  return {st,en,cnt,entitled,used,penalty,
          left:Math.max(0,entitled-used-penalty)};
}

const S={pw:'',date:today(),students:[],classes:[],leaders:[],
         sel:null,selCls:null,calM:'',scope:'day',hist:{},chart:['bTest','oTest'],loading:false,cprog:{},pmap:{},videos:[],calTab:'prog'};

const $=id=>document.getElementById(id);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!==undefined)e.innerHTML=h;return e;};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

/* ============ 로그인 ============ */
// 원장방에서 '로그인 유지'를 켜 둔 경우 비밀번호를 다시 묻지 않음
if(localStorage.getItem('kkj_admin_auth')==='true'){
  $('gate').style.display='none';
  $('shell').classList.add('on');
  window.addEventListener('DOMContentLoaded',()=>{});
  setTimeout(()=>boot(),0);
}
$('gbtn').onclick=async()=>{
  const v=$('gpw').value.trim();
  if(!v){$('gerr').textContent='비밀번호를 입력하세요.';return;}
  $('gbtn').textContent='확인 중…';
  const pw=await fbGet('pw');
  if(v!==(pw||'admin1234')){
    $('gerr').textContent='비밀번호가 맞지 않습니다.';
    $('gbtn').textContent='들어가기';$('gpw').select();return;
  }
  $('gate').style.display='none';
  $('shell').classList.add('on');
  await boot();
};
$('gpw').onkeydown=e=>{if(e.key==='Enter')$('gbtn').click();};

/* ============ 기초 데이터 ============ */
async function boot(){
  $('dsel').value=S.date;
  $('dsel').onchange=()=>{S.date=$('dsel').value;S.sel=null;paint();};
  $('reload').onclick=async()=>{S.hist={};await loadBase();paint();};
  $('toadmin').onclick=()=>{location.href='/admin.html';};
  await loadBase();
  paint();
}
async function loadBase(){
  const [st,cl,ld,cp]=await Promise.all([fbGet('students'),fbGet('classes'),fbGet('leaders'),fbGet('classProgress')]);
  S.cprog=cp||{};
  const vd=await fbGet('videos');
  S.videos=vd?(Array.isArray(vd)?vd.filter(Boolean):Object.values(vd)):[];
  S.students=st?(Array.isArray(st)?st.filter(Boolean):Object.values(st)):[];
  S.classes=cl?(Array.isArray(cl)?cl.filter(Boolean):Object.values(cl)):[];
  S.leaders=ld?(Array.isArray(ld)?ld.filter(Boolean):Object.values(ld)):[];
}

// 학생 1명의 전체 수업기록을 1회 호출로 (월평균·추이 계산용)
async function loadHist(sid){
  if(S.hist[sid])return S.hist[sid];
  const raw=await fbGet(`lessons/${sid}`)||{};
  const rows=Object.keys(raw).map(k=>({date:dsh(k),l:raw[k]})).sort((a,b)=>a.date.localeCompare(b.date));
  S.hist[sid]={rows,raw};
  return S.hist[sid];
}
async function saveField(sid,date,patch){
  const h=await loadHist(sid);
  const key=und(date);
  const cur=h.raw[key]||{};
  const next={...cur,...patch};
  h.raw[key]=next;
  const i=h.rows.findIndex(r=>r.date===date);
  if(i>=0)h.rows[i].l=next;
  else{h.rows.push({date,l:next});h.rows.sort((a,b)=>a.date.localeCompare(b.date));}
  await fbSet(`lessons/${sid}/${key}`,next);
}

// 반 진도 조회 (개별 조정이 없을 때의 기본값)
function clsProg(cid,date){
  const m=S.cprog[cid];
  if(!m)return {unit:'',page:''};
  const v=m[und(date)];
  if(!v)return {unit:'',page:''};
  return {unit:v.unit||v.title||'',page:v.page||''};
}

/* ============ 렌더 ============ */
function paint(){
  const d=dow(S.date);
  $('ddow').textContent=DAYS[d]+'요일';
  paintL(d);
  paintC();
  paintR();
}

/* ---- 좌: 반 / 학생 ---- */
function paintL(d){
  const box=$('colL');box.innerHTML='';
  const todayS=S.students.filter(s=>s.days&&s.days.includes(d));
  const list=S.scope==='day'?todayS:S.students;

  const head=el('div','l-head');
  head.appendChild(el('div','cnt',`오늘 수업 ${todayS.length}명 · 전체 ${S.students.length}명`));
  const seg=el('div','seg');
  [['day','오늘'],['all','전체']].forEach(([k,t])=>{
    const b=el('button',S.scope===k?'on':'',t);
    b.onclick=()=>{S.scope=k;paint();};
    seg.appendChild(b);
  });
  head.appendChild(seg);
  box.appendChild(head);

  if(!list.length){box.appendChild(el('div','empty','해당하는 학생이 없습니다.'));return;}

  const byCls={};
  list.forEach(s=>{(byCls[s.classId||'_']=byCls[s.classId||'_']||[]).push(s);});
  Object.keys(byCls).forEach(cid=>{
    const cls=S.classes.find(c=>String(c.id)===String(cid));
    const ch=el('button','cls-h'+(S.selCls===String(cid)?' on':''));
    ch.appendChild(el('span','cn',esc(cls?cls.name:'반 미배정')));
    ch.appendChild(el('span','cc',byCls[cid].length+'명'));
    ch.title='반 진도를 달력으로 보기';
    ch.onclick=()=>{
      S.selCls=S.selCls===String(cid)?null:String(cid);
      if(S.selCls)S.sel=null;
      paint();
    };
    box.appendChild(ch);
    byCls[cid].sort((a,b)=>(a.name||'').localeCompare(b.name||'')).forEach(s=>{
      const b=el('button','stu-row'+(S.sel===s.id?' on':''));
      const h=S.hist[s.id];
      let st='';
      if(h){const r=h.rows.find(r=>r.date===S.date);st=r?attOf(r.l):'';}
      const cls2={present:'d-ok',absent:'d-no',makeup:'d-mk'}[st]||'d-na';
      // (사유별 색은 상세에서 확인)
      b.appendChild(el('span','dot '+cls2));
      const w=el('span');
      w.appendChild(el('b','',esc(s.name)));
      if(s.level&&s.level!=='선택 안 함')w.appendChild(el('em','',' '+esc(s.level)));
      b.appendChild(w);
      b.onclick=async()=>{S.sel=s.id;S.selCls=null;S.loading=true;paint();await loadHist(s.id);S.loading=false;paint();};
      box.appendChild(b);
    });
  });
}

/* ---- 중앙: 학생 상세 ---- */
function paintC(){
  const box=$('colC');box.innerHTML='';
  if(S.selCls){return paintCal(box);}
  if(!S.sel){box.appendChild(el('div','load','왼쪽에서 학생을 선택하면 상세 정보가 열립니다. 반 이름을 누르면 반 진도를 달력으로 봅니다.'));return;}
  const s=S.students.find(x=>x.id===S.sel);
  if(!s){box.appendChild(el('div','load','학생 정보를 찾을 수 없습니다.'));return;}
  if(S.loading||!S.hist[s.id]){box.appendChild(el('div','load','불러오는 중…'));return;}

  const h=S.hist[s.id];
  const rec=h.rows.find(r=>r.date===S.date);
  const l=rec?rec.l:{};

  // 프로필
  const c1=el('div','card');
  const who=el('div','who');
  who.appendChild(el('h2','',esc(s.name)));
  const cls=S.classes.find(c=>String(c.id)===String(s.classId));
  const ld=S.leaders.find(x=>x.students&&x.students.includes(s.id));
  who.appendChild(el('span','',[cls&&cls.name,s.level,ld&&ld.name+' 리더'].filter(Boolean).map(esc).join(' · ')));
  c1.appendChild(who);
  const meta=el('div','meta');
  [['학교',s.info&&s.info.school],['교재',s.info&&s.info.book],
   ['수업 요일',(s.days||[]).sort((a,b)=>a-b).map(d=>DAYS[d]).join('·')],
   ['결제일',s.billDay?`매월 ${s.billDay}일`:''],
   ['누적 수업일',h.rows.length+'일']].forEach(([k,v])=>{
    const d=el('div');d.appendChild(el('dt','',k));d.appendChild(el('dd','',esc(v||'—')));meta.appendChild(d);
  });
  c1.appendChild(meta);
  box.appendChild(c1);

  // 출석
  const c2=el('div','card');
  c2.appendChild(el('div','card-t',md(S.date)+' 출석'));
  const set=el('div','att-set');
  const cur=attOf(l);
  [['present','출석','on-ok'],['absent','결석','on-no'],['makeup','보강','on-mk']].forEach(([k,t,c])=>{
    const b=el('button',cur===k?c:'',t);
    b.onclick=async()=>{await saveField(s.id,S.date,{attend:cur===k?'':k});paint();};
    set.appendChild(b);
  });
  c2.appendChild(set);

  // 결석 → 사유
  if(cur==='absent'){
    c2.appendChild(el('div','sub-t','결석 사유'));
    const rs=el('div','att-set');
    REASONS.forEach(r=>{
      const on=(l.reason||'')===r.k;
      const b=el('button',on?'on-no':'',r.n);
      if(on)b.style.cssText=`background:${r.c}18;border-color:${r.c};color:${r.c};`;
      b.onclick=async()=>{await saveField(s.id,S.date,{reason:on?'':r.k});paint();};
      rs.appendChild(b);
    });
    c2.appendChild(rs);
    if(!l.reason)c2.appendChild(el('div','warn','사유를 선택해야 보강 횟수에 반영됩니다.'));
  }

  // 보강 → 어느 결석의 보강인지 + 페널티
  if(cur==='makeup'){
    c2.appendChild(el('div','sub-t','어느 결석의 보강인가요'));
    const sel=el('select','pick');
    const o0=el('option','','선택 안 함 (당일 기준)');o0.value='';sel.appendChild(o0);
    h.rows.filter(r=>attOf(r.l)==='absent').sort((a,b)=>b.date.localeCompare(a.date)).slice(0,12)
      .forEach(r=>{
        const o=el('option');o.value=r.date;
        const rn=(REASONS.find(x=>x.k===r.l.reason)||{}).n||'사유 미입력';
        o.textContent=`${md(r.date)} 결석 · ${rn}`;
        if((l.makeupFor||'')===r.date)o.selected=true;
        sel.appendChild(o);
      });
    sel.onchange=async()=>{await saveField(s.id,S.date,{makeupFor:sel.value});paint();};
    c2.appendChild(sel);

    const pl=el('label','pen');
    const cb=el('input');cb.type='checkbox';cb.checked=!!l.penalty;
    cb.onchange=async()=>{await saveField(s.id,S.date,{penalty:cb.checked});paint();};
    pl.appendChild(cb);
    pl.appendChild(el('span','','단어·숙제 미이행 — 보강 1회 차감'));
    c2.appendChild(pl);
  }
  box.appendChild(c2);

  // 점수
  const c3=el('div','card');
  c3.appendChild(el('div','card-t',md(S.date)+' 테스트 점수'));
  const g=el('div','score-grid');
  TESTS.forEach(t=>{
    const lab=el('label');
    lab.appendChild(el('dt','',t.n));
    const i=el('input');i.type='number';i.min=0;i.max=100;i.placeholder='—';
    i.value=l[t.k]==null?'':l[t.k];
    i.onchange=async()=>{await saveField(s.id,S.date,{[t.k]:i.value===''?'':Number(i.value)});paintR();paintL(dow(S.date));};
    lab.appendChild(i);g.appendChild(lab);
  });
  c3.appendChild(g);
  box.appendChild(c3);

  // 진도
  const c4=el('div','card');
  const t4=el('div','card-t','진도');
  t4.appendChild(el('div','spacer'));
  const add=el('button','mini','이 날짜 개별 조정');
  add.onclick=async()=>{
    const base=clsProg(s.classId,S.date);
    await saveField(s.id,S.date,{progress:{unit:base.unit||'',page:base.page||''}});
    paintC();
  };
  t4.appendChild(add);
  c4.appendChild(t4);

  // 오늘 기준 진도
  const baseT=clsProg(s.classId,S.date);
  const ownT=l.progress;
  const now=el('div','pnow'+(ownT?' ov':''));
  now.appendChild(el('span','tag',ownT?'개별 조정':'반 진도'));
  now.appendChild(el('b','',esc((ownT||baseT).unit||'—')));
  if((ownT||baseT).page)now.appendChild(el('em','',' · '+esc((ownT||baseT).page)));
  if(!ownT&&!baseT.unit&&!baseT.page)now.lastChild.textContent='아직 등록된 진도가 없습니다';
  c4.appendChild(now);

  // 이력 (반 진도 + 개별 조정 병합)
  const dates={};
  h.rows.forEach(r=>{if(r.l&&r.l.progress)dates[r.date]=1;});
  Object.keys(S.cprog[s.classId]||{}).forEach(k=>{dates[dsh(k)]=1;});
  const dl=Object.keys(dates).sort().reverse().slice(0,16);

  if(!dl.length){
    c4.appendChild(el('div','empty','반 진도를 엑셀로 올리거나, 이 날짜를 개별 조정해 보세요.'));
  }else{
    dl.forEach(d=>{
      const base=clsProg(s.classId,d);
      const rec=h.rows.find(r=>r.date===d);
      const own=rec&&rec.l&&rec.l.progress;
      const row=el('div','prog-row'+(own?' ov':''));
      row.appendChild(el('span','dt',md(d)));
      if(own){
        const u=el('input');u.placeholder='단원';u.value=own.unit||'';
        const p=el('input');p.placeholder='페이지';p.value=own.page||'';
        const save=async()=>{await saveField(s.id,d,{progress:{unit:u.value,page:p.value}});};
        u.onchange=save;p.onchange=save;
        row.appendChild(u);row.appendChild(p);
        const del=el('button','mini q','반 진도로');
        del.title='개별 조정을 지우고 반 진도를 따릅니다';
        del.onclick=async()=>{await saveField(s.id,d,{progress:null});paintC();};
        row.appendChild(del);
      }else{
        const w=el('div','pbase');
        w.appendChild(el('span','',esc(base.unit||'—')));
        if(base.page)w.appendChild(el('em','',' · '+esc(base.page)));
        row.appendChild(w);
        const ed=el('button','mini q','조정');
        ed.onclick=async()=>{await saveField(s.id,d,{progress:{unit:base.unit||'',page:base.page||''}});paintC();};
        row.appendChild(ed);
      }
      c4.appendChild(row);
    });
  }

let SROWS=[];
const DOWMAP={'일':0,'월':1,'화':2,'수':3,'목':4,'금':5,'토':6};
function parseDays(v){
  const t=norm(v);if(!t)return null;
  const out=[];
  t.replace(/요일/g,'').split(/[,\s·\/]+/).join('').split('').forEach(ch=>{
    if(DOWMAP[ch]!==undefined&&!out.includes(DOWMAP[ch]))out.push(DOWMAP[ch]);
  });
  return out.length?out.sort((a,b)=>a-b):null;
}
async function saveStudents(){
  const obj={},priv={};
  S.students.forEach(st=>{
    const {info,...rest}=st;
    const {phone,...safe}=info||{};
    obj[st.id]={...rest,info:safe};
    if(phone)priv[st.id]={phone};
  });
  await fbSet('students',obj);
  if(Object.keys(priv).length)await fbSet('privateInfo',priv);
}

function readStu(file){
  const fr=new FileReader();
  fr.onload=e=>{
    let wb;
    try{wb=XLSX.read(e.target.result,{type:'array'});}
    catch(err){$('sprev').innerHTML='<div class="warn">파일을 읽지 못했습니다.</div>';return;}
    const raw=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,blankrows:false});
    if(raw.length<2){$('sprev').innerHTML='<div class="warn">읽을 데이터가 없습니다. 첫 줄은 열 이름이어야 합니다.</div>';return;}
    const head=raw[0].map(h=>norm(h).replace(/\s/g,''));
    const col=(...ns)=>{for(const n of ns){const i=head.indexOf(n);if(i>=0)return i;}return -1;};
    const C={name:col('이름','학생','학생이름'),code:col('학부모코드','코드','비밀번호'),
      vcode:col('영상코드','학생코드'),cls:col('반','반이름','클래스'),lv:col('레벨'),
      sch:col('학교'),gen:col('성별'),book:col('교재','사용교재'),
      ph:col('연락처','전화번호','학부모연락처'),bill:col('결제일','수강결제일'),days:col('수업요일','요일')};
    if(C.name<0){$('sprev').innerHTML='<div class="warn">\'이름\' 열을 찾을 수 없습니다. 첫 줄의 열 이름을 확인해 주세요.</div>';return;}

    SROWS=[];
    const seen={};
    for(let r=1;r<raw.length;r++){
      const row=raw[r]||[];
      const nm=norm(row[C.name]);
      if(!nm)continue;
      const g=v=>C[v]>=0?norm(row[C[v]]):'';
      const hits=S.students.filter(st=>norm(st.name)===nm);
      let err='';
      if(hits.length>1)err='동명이인 — 앱에서 직접 수정';
      else if(seen[nm])err='엑셀 안에 이름 중복';
      seen[nm]=1;
      const clsName=g('cls');
      let cid='';
      if(clsName){
        const c=S.classes.find(c=>norm(c.name)===clsName);
        if(c)cid=c.id; else if(!err)err=`'${clsName}' 반이 없습니다`;
      }
      const bill=g('bill').replace(/[^\d]/g,'');
      if(bill&&(+bill<1||+bill>31)&&!err)err='결제일은 1~31 사이여야 합니다';
      SROWS.push({line:r+1,name:nm,exist:hits.length===1?hits[0]:null,err,
        code:g('code'),vcode:g('vcode'),cid,clsName,lv:g('lv'),sch:g('sch'),gen:g('gen'),
        book:g('book'),ph:g('ph'),bill:bill?+bill:'',days:parseDays(g('days'))});
    }
    renderSPrev();
  };
  fr.readAsArrayBuffer(file);
}

function renderSPrev(){
  const ok=SROWS.filter(r=>!r.err), bad=SROWS.filter(r=>r.err);
  const nw=ok.filter(r=>!r.exist).length, up=ok.filter(r=>r.exist).length;
  const box=$('sprev');box.innerHTML='';
  if(!SROWS.length){box.innerHTML='<div class="warn">반영할 줄이 없습니다.</div>';$('sgo').disabled=true;return;}
  const sum=el('div','xsum');

    const d=el('div',c);d.appendChild(el('b','',v));d.appendChild(el('span','',t));sum.appendChild(d);
  });
  box.appendChild(sum);
  const sc=el('div','xscroll');

  tb.innerHTML='<tr><th>줄</th><th>이름</th><th>반</th><th>요일</th><th>결제일</th><th>상태</th></tr>'+
    SROWS.slice(0,200).map(r=>`<tr class="${r.err?'bad':''}"><td>${r.line}</td><td>${esc(r.name)}</td><td>${esc(r.clsName)}</td><td>${r.days?r.days.map(d=>DAYS[d]).join(''):'—'}</td><td>${r.bill||'—'}</td><td>${r.err||(r.exist?'수정':'신규')}</td></tr>`).join('');
  sc.appendChild(tb);box.appendChild(sc);

}

$('sgo').onclick=async()=>{

function paintCal(box){
  const cid=S.selCls;
  const cls=S.classes.find(c=>String(c.id)===String(cid));
  const map=S.cprog[cid]||{};

  if(!S.calM){
    const ks=Object.keys(map).sort();
    S.calM=ks.length?dsh(ks[ks.length-1]).slice(0,7):S.date.slice(0,7);
  }
  const [cy,cm]=S.calM.split('-').map(Number);

  const head=el('div','cal-head');
  const ttl=el('div','cal-t');
  ttl.appendChild(el('b','',esc(cls?cls.name:'반 미배정')));
  ttl.appendChild(el('span','',S.calTab==='prog'?`${cy}년 ${cm}월 진도`:'반 전체 영상 배정'));
  head.appendChild(ttl);
  if(S.calTab!=='prog'){
    box.appendChild(head);
    const tabs=el('div','tabs');
    [['prog','진도 달력'],['vid','영상 배정']].forEach(([k,t])=>{
      const b=el('button',S.calTab===k?'on':'',t);
      b.onclick=()=>{S.calTab=k;paintC();};
      tabs.appendChild(b);
    });
    box.appendChild(tabs);
    const mem=S.students.filter(st=>String(st.classId)===String(cid));
    box.appendChild(el('div','xdesc2',`저장하면 이 반 ${mem.length}명 전원의 영상 목록이 아래 선택으로 교체됩니다.`));
    // 반 전원이 공통으로 가진 영상만 체크 상태로 시작
    const common=S.videos.filter(v=>mem.length&&mem.every(st=>(st.videos||[]).includes(v.id))).map(v=>v.id);
    paintVideo(box,common,'반',async ids=>{
      mem.forEach(st=>{st.videos=[...ids];});
      await saveStudents();
    });
    return;
  }

  const nav=el('div','cal-nav');
  const mv=n=>{let y=cy,m=cm+n;if(m<1){m=12;y--;}if(m>12){m=1;y++;}S.calM=`${y}-${pad(m)}`;paintC();};
  const bp=el('button','','‹');bp.onclick=()=>mv(-1);
  const bn=el('button','','›');bn.onclick=()=>mv(1);
  const bt=el('button','today','이번 달');bt.onclick=()=>{S.calM=today().slice(0,7);paintC();};
  nav.appendChild(bp);nav.appendChild(bt);nav.appendChild(bn);
  head.appendChild(nav);
  box.appendChild(head);

  const tabs=el('div','tabs');
  [['prog','진도 달력'],['vid','영상 배정']].forEach(([k,t])=>{
    const b=el('button',S.calTab===k?'on':'',t);
    b.onclick=()=>{S.calTab=k;paintC();};
    tabs.appendChild(b);
  });
  box.appendChild(tabs);

  const grid=el('div','cal');
  DAYS.forEach((d,i)=>grid.appendChild(el('div','cal-dow'+(i===0?' sun':i===6?' sat':''),d)));

  const first=new Date(cy,cm-1,1).getDay();
  const last=lastDay(cy,cm);
  for(let i=0;i<first;i++)grid.appendChild(el('div','cal-c off'));

  let filled=0;
  for(let d=1;d<=last;d++){
    const ds=`${cy}-${pad(cm)}-${pad(d)}`;
    const dw=new Date(cy,cm-1,d).getDay();
    const c=el('div','cal-c'+(ds===today()?' now':'')+(dw===0?' sun':dw===6?' sat':''));
    c.appendChild(el('div','cal-n',d));
    const v=map[und(ds)];
    if(v&&(v.unit||v.page)){
      filled++;
      String(v.unit||'').split(' / ').filter(Boolean).forEach(t=>{
        const it=el('div','cal-i',esc(t));
        it.title=t;
        c.appendChild(it);
      });
      if(v.page)c.appendChild(el('div','cal-p',esc(v.page)));
    }
    grid.appendChild(c);
  }
  box.appendChild(grid);

  const ft=el('div','cal-f');
  ft.textContent=filled?`${cm}월 ${filled}일치 진도가 등록되어 있습니다.`
                       :`${cm}월에 등록된 진도가 없습니다. 상단 '진도 업로드'로 캘린더 파일을 올려 보세요.`;
  box.appendChild(ft);
}

const drop=$('xdrop');
['dragover','dragenter'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over');}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over');}));
drop.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f)readXls(f);});
$('xfile').onchange=e=>{const f=e.target.files[0];if(f)readXls(f);};

function readXls(file){
  const fr=new FileReader();
  fr.onload=e=>{
    let wb;
    try{wb=XLSX.read(e.target.result,{type:'array'});}
    catch(err){$('xprev').innerHTML='<div class="warn">파일을 읽지 못했습니다. 엑셀(.xlsx)인지 확인해 주세요.</div>';return;}
    XITEMS=[];
    wb.SheetNames.forEach(n=>parseSheet(XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,blankrows:false})));
    if(!XITEMS.length){
      $('xprev').innerHTML='<div class="warn">읽을 항목이 없습니다. 월 캘린더 형식(제목 → 요일 → 날짜/내용 반복)인지 확인해 주세요.</div>';
      $('xgo').disabled=true;return;
    }
    renderMap();
  };
  fr.readAsArrayBuffer(file);
}

// 월 캘린더 시트 → 항목 목록
function parseSheet(rows){
  let y=0,mo=0;
  for(const r of rows){
    const t=(r||[]).map(norm).join(' ');
    const m=t.match(/(\d{4})\s*년\s*(\d{1,2})\s*월/);
    if(m){y=+m[1];mo=+m[2];break;}
  }
  if(!y){const n=new Date();y=n.getFullYear();mo=n.getMonth()+1;}

  for(let i=0;i<rows.length;i++){
    const row=rows[i]||[];
    // 날짜 줄: 1~31 숫자가 2개 이상, 항목 기호 없음
    const nums=row.map(c=>{const v=norm(c).replace(/\.0$/,'');return /^\d{1,2}$/.test(v)?+v:null;});
    const cnt=nums.filter(v=>v&&v>=1&&v<=31).length;
    if(cnt<2)continue;
    const body=rows[i+1]||[];
    if(!body.some(c=>norm(c)))continue;
    nums.forEach((d,col)=>{
      if(!d||d<1||d>31)return;
      const cell=norm(body[col]);
      if(!cell)return;
      const date=`${y}-${pad(mo)}-${pad(d)}`;
      cell.split(/\r?\n/).forEach(line=>{
        const t=line.replace(/^[•·\-\s]+/,'').trim();
        if(!t)return;
        const pm=t.match(/^([^_]+?)[_\-]/);
        const prefix=pm?pm[1].trim():'(구분 없음)';
        XITEMS.push({date,prefix,title:t});
      });
    });
    i++; // 내용 줄 건너뜀
  }
}

// 접두어 → 반 매핑 화면
function renderMap(){
  const box=$('xprev');box.innerHTML='';
  const pre={};
  XITEMS.forEach(it=>{pre[it.prefix]=(pre[it.prefix]||0)+1;});
  const keys=Object.keys(pre).sort();

  box.appendChild(el('div','sub-t','어느 반의 진도인가요'));
  box.appendChild(el('div','xdesc2',`항목 ${XITEMS.length}건 · 구분 ${keys.length}종. 반을 고른 것만 반영됩니다.`));

  const sc=el('div','xscroll');
  keys.forEach(k=>{
    const row=el('div','maprow');
    const lft=el('div','mapl');
    lft.appendChild(el('b','',esc(k)));
    lft.appendChild(el('em','',` ${pre[k]}건`));
    row.appendChild(lft);
    const sel=el('select','pick');
    const o0=el('option');o0.value='';o0.textContent='반영 안 함';sel.appendChild(o0);
    S.classes.forEach(c=>{
      const o=el('option');o.value=c.id;o.textContent=c.name;
      if(String(S.pmap[k]||'')===String(c.id))o.selected=true;
      sel.appendChild(o);
    });
    sel.onchange=()=>{S.pmap[k]=sel.value;updGo();};
    row.appendChild(sel);
    sc.appendChild(row);
  });
  box.appendChild(sc);

  const ex=el('div','xex');
  ex.appendChild(el('div','sub-t','읽어들인 내용 (앞 8건)'));
  XITEMS.slice(0,8).forEach(it=>{
    ex.appendChild(el('div','xline',`<span>${md(it.date)}</span> ${esc(it.title)}`));
  });
  box.appendChild(ex);
  updGo();
}

function updGo(){
  const n=XITEMS.filter(it=>S.pmap[it.prefix]).length;
  $('xgo').disabled=!n;
  $('xgo').textContent=n?`${n}건 반영하기`:'반을 선택하세요';
}

$('xgo').onclick=async()=>{
  const use=XITEMS.filter(it=>S.pmap[it.prefix]);
  if(!use.length)return;
  const btn=$('xgo');btn.disabled=true;

  // 반+날짜로 묶기 (같은 날 여러 편이면 줄바꿈으로 합침)
  const bag={};
  use.forEach(it=>{
    const cid=S.pmap[it.prefix];
    const k=cid+'|'+it.date;
    (bag[k]=bag[k]||[]).push(it.title);
  });
  const keys=Object.keys(bag);
  let done=0;
  for(const k of keys){
    const [cid,date]=k.split('|');
    const val={unit:bag[k].join(' / '),page:''};
    S.cprog[cid]=S.cprog[cid]||{};
    S.cprog[cid][und(date)]=val;
    await fbSet(`classProgress/${cid}/${und(date)}`,val);
    done++;btn.textContent=`반영 중… ${done}/${keys.length}`;
  }
  btn.textContent='완료';
  setTimeout(()=>{$('xmodal').classList.remove('on');paint();},600);
};

/* ---- 추이 그래프 (SVG) ---- */
function chart(rows){
  const W=314,H=150,PL=26,PR=8,PT=10,PB=20;
  const series=TESTS.filter(t=>S.chart.includes(t.k)).map(t=>({
    ...t,
    pts:rows.map(r=>({d:r.date,v:r.l&&r.l[t.k]})).filter(p=>p.v!==''&&p.v!=null&&!isNaN(Number(p.v)))
            .map(p=>({d:p.d,v:Number(p.v)})).slice(-12)
  })).filter(s=>s.pts.length);

  if(!series.length)return el('div','empty','표시할 점수가 없습니다.');

  const n=Math.max(...series.map(s=>s.pts.length));
  const X=i=>PL+(n<2?(W-PL-PR)/2:(W-PL-PR)*i/(n-1));
  const Y=v=>PT+(H-PT-PB)*(1-v/100);

  let g='';
  [0,50,100].forEach(v=>{
    g+=`<line x1="${PL}" y1="${Y(v)}" x2="${W-PR}" y2="${Y(v)}" stroke="#E3E8F4" stroke-width="1"/>`;
    g+=`<text x="${PL-6}" y="${Y(v)+3.5}" text-anchor="end" font-size="9" fill="#8A97B4" font-weight="700">${v}</text>`;
  });
  series.forEach(s=>{
    const off=n-s.pts.length;
    const d=s.pts.map((p,i)=>`${i?'L':'M'}${X(i+off).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ');
    g+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    s.pts.forEach((p,i)=>{g+=`<circle cx="${X(i+off).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="3" fill="#fff" stroke="${s.c}" stroke-width="2"><title>${md(p.d)} ${s.n} ${p.v}점</title></circle>`;});
  });
  const last=series[0].pts;
  const off0=n-last.length;
  last.forEach((p,i)=>{
    if(last.length>6&&i%2)return;
    g+=`<text x="${X(i+off0).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="9" fill="#8A97B4" font-weight="600">${md(p.d)}</text>`;
  });

  const wrap=el('div');
  wrap.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="테스트 점수 추이 그래프">${g}</svg>`;
  return wrap;
}
})();
